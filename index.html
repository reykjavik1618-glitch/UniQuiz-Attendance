<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-start:#f0f4ff;
  --bg-end:#f0fdfa;
  --card:#ffffff;
  --border:#bfdbfe;
  --text:#1e293b;
  --muted:#64748b;
  --primary:#2563eb;
  --primary2:#0891b2;
  --primary-dark:#1d4ed8;
  --danger:#f43f5e;
  --success:#22c55e;
  --warning:#fbbf24;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:linear-gradient(160deg, var(--bg-start), var(--bg-end));
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
}
.container{
  max-width:640px;
  margin:0 auto;
  padding:32px 20px 60px;
}
h1{
  font-size:26px;
  font-weight:800;
  margin:0 0 20px;
  background:linear-gradient(135deg, var(--primary-dark), var(--primary2));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
}
.card{
  background:var(--card);
  border:2px solid #dbeafe;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(37,99,235,0.10);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.card:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(37,99,235,0.16); }
.card-title{font-weight:700;font-size:16px;}
.card-sub{color:var(--muted);font-size:13px;margin-top:4px;font-weight:700;}
.card-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
button{
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  padding:10px 20px;
  border-radius:999px;
  border:none;
  background:linear-gradient(135deg, var(--primary-dark), var(--primary2));
  color:#fff;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(37,99,235,0.30);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
button:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 6px 18px rgba(37,99,235,0.40); }
button:active{ transform:translateY(0) scale(0.97); }
button.secondary{background:#fff;color:var(--primary-dark);border:2px solid #dbeafe;box-shadow:none;}
button.secondary:hover{background:#eff6ff;}
button.danger{background:#fff;color:var(--danger);border:2px solid #fecdd3;box-shadow:none;}
button.danger:hover{background:#fff1f2;}
button.link{background:none;border:none;color:var(--primary-dark);padding:0;margin-bottom:16px;font-size:14px;box-shadow:none;font-weight:700;}
button.link:hover{transform:none;text-decoration:underline;box-shadow:none;}
button:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.top-actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}

form label{display:block;margin-bottom:14px;font-size:14px;font-weight:700;}
form textarea, form input[type=text], form input[type=number]{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border:2px solid #e9d5ff;
  border-radius:12px;
  font-family:inherit;
  font-size:14px;
  background:#fff;
}
form textarea:focus, form input:focus{ outline:none; border-color:var(--primary); }
form select{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border:2px solid #e9d5ff;
  border-radius:12px;
  font-family:inherit;
  font-size:14px;
  background:#fff;
}
form select:focus{ outline:none; border-color:var(--primary); }
.choice-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.choice-row input[type=text]{flex:1;margin-top:0;}
.form-actions{margin-top:20px;display:flex;gap:8px;}
.text-answer-area{display:flex;gap:8px;align-items:stretch;margin-bottom:4px;flex-wrap:wrap;}

</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'quizAppData_v1';
const DEFAULT_TIME_LIMIT = 30;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.quizSets)) parsed.quizSets = [];
      if(!Array.isArray(parsed.importedExportIds)) parsed.importedExportIds = [];
      return parsed;
    }
  }catch(e){}
  return { quizSets: [], importedExportIds: [] };
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let data = loadData();
let view = 'home';
let currentSetId = null;
let editingQuestionId = null;
let session = null;
let timerInterval = null;
let timeLeft = 0;
/* 受験者情報・送信まわり（メモリ上のみ。共用端末でも前の人の情報が残らない） */
let student = { name:'', id:'' };
let pendingSetId = null;
let studentErrors = {};
let commentText = '';
let sending = false;
let sendError = '';
let pendingError = '';
const PENDING_KEY = 'quizAppPendingSubmission_v1';

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function getSet(id){ return data.quizSets.find(s=>s.id===id); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const app = document.getElementById('app');

/* ---------- TEACHER AUTH ---------- */
const TEACHER_PASSWORD_KEY = 'quizAppTeacherPassword_v1';
const TEACHER_AUTH_SESSION_KEY = 'quizAppTeacherAuthed_v1';
const DEFAULT_TEACHER_PASSWORD = 'sensei2026';

function getTeacherPassword(){
  return localStorage.getItem(TEACHER_PASSWORD_KEY) || DEFAULT_TEACHER_PASSWORD;
}
function isTeacherAuthed(){
  return sessionStorage.getItem(TEACHER_AUTH_SESSION_KEY) === '1';
}
function requireTeacherAuth(){
  if(isTeacherAuthed()) return true;
  const input = prompt('🔑 講師用パスワードを入力してください');
  if(input === null) return false;
  if(input === getTeacherPassword()){
    sessionStorage.setItem(TEACHER_AUTH_SESSION_KEY, '1');
    return true;
  }
  alert('❌ パスワードが正しくありません');
  return false;
}
function teacherLogin(){
  if(requireTeacherAuth()) render();
}
function teacherLogout(){
  sessionStorage.removeItem(TEACHER_AUTH_SESSION_KEY);
  render();
}
function changeTeacherPassword(){
  if(!requireTeacherAuth()) return;
  const newPass = prompt('新しい講師用パスワードを入力してください(4文字以上推奨)');
  if(!newPass) return;
  const confirmPass = prompt('確認のため、もう一度入力してください');
  if(newPass !== confirmPass){ alert('❌ パスワードが一致しません。変更されませんでした。'); return; }
  localStorage.setItem(TEACHER_PASSWORD_KEY, newPass);
  alert('✅ パスワードを変更しました');
}

function render(){
  let html = '';
  if(view==='home') html = renderHome();
  else if(view==='adminQuestions') html = renderAdminQuestions();
  else if(view==='adminQuestionForm') html = renderAdminQuestionForm();
  else if(view==='quiz') html = renderQuizView();
  else if(view==='result') html = renderResultView();
  else if(view==='studentInfo') html = renderStudentInfo();
  else if(view==='ready') html = renderReady();
  else if(view==='qr') html = renderQr();
  else if(view==='comment') html = renderComment();
  else if(view==='done') html = renderDone();
  app.innerHTML = html;
}

/* ---------- HOME ---------- */
function buildQuizGuidance(set){
  const total = set.questions.length;
  if(total === 0) return '';
  let c4 = 0, c2 = 0, t = 0;
  const limits = new Set();
  set.questions.forEach(q=>{
    if(q.type === 'text') t++;
    else if(q.choices && q.choices.length === 2) c2++;
    else c4++;
    limits.add(q.timeLimit || DEFAULT_TIME_LIMIT);
  });
  const typeKinds = (c4>0?1:0) + (c2>0?1:0) + (t>0?1:0);
  let typeText;
  if(typeKinds <= 1){
    if(c4>0) typeText = '4択から1つ正解と思うものを選んでください。';
    else if(c2>0) typeText = '2択から1つ正解と思うものを選んでください。';
    else typeText = '正解だと思う言葉を入力してください。';
  } else {
    const parts = [];
    if(c4>0) parts.push(`4択${c4}問`);
    if(c2>0) parts.push(`2択${c2}問`);
    if(t>0) parts.push(`記述式${t}問`);
    typeText = `${parts.join('・')}が含まれます。各問題の指示に従って回答してください。`;
  }
  let timeText;
  if(limits.size === 1){
    timeText = `回答時間は1問当たり${[...limits][0]}秒です。`;
  } else {
    const arr = [...limits].sort((a,b)=>a-b);
    timeText = `回答時間は問題により異なります(${arr[0]}〜${arr[arr.length-1]}秒)。`;
  }
  return `全${total}問。${typeText}${timeText}`;
}

function renderHome(){
  const authed = isTeacherAuthed();
  let listHtml = '';
  if(data.quizSets.length===0){
    listHtml = authed
      ? '<div class="empty">✨ クイズセットがまだありません。「✨ 新しいクイズセットを作成」から始めましょう。</div>'
      : '<div class="empty">✨ クイズセットがまだありません。講師の方は「🔑 講師ログイン」からクイズを作成できます。</div>';
  } else {
    listHtml = data.quizSets.map(s=>`
      <div class="card">
        <div class="card-title">📚 ${escapeHtml(s.name)}</div>
        <div class="card-sub">${s.questions.length===0?'0問':escapeHtml(buildQuizGuidance(s))}</div>
        <div class="card-actions">
          <button onclick="startQuiz('${s.id}')" ${s.questions.length===0?'disabled':''}>▶️ 受験する</button>
          ${authed?`<button class="secondary" onclick="goToAdminQuestions('${s.id}')">⚙️ 問題を管理</button><button class="secondary" onclick="goToQr('${s.id}')">📱 QR</button>`:''}
        </div>
      </div>
    `).join('');
  }
  const adminActionsHtml = authed
    ? `
      <button onclick="createQuizSet()">✨ 新しいクイズセットを作成</button>
      <button class="secondary" onclick="triggerImportPicker()">📥 クイズを読み込む</button>
      ${data.quizSets.length>0?'<button class="secondary" onclick="exportAllQuizSets()">📤 全部書き出す</button>':''}
      <button class="secondary" onclick="teacherLogout()">🔒 講師ログアウト</button>
    `
    : `<button class="secondary" onclick="teacherLogin()">🔑 講師ログイン</button>`;
  return `
    <div class="container">
      <div class="home-hero">
        <span class="hero-badge">CAMPUS QUIZ TIME</span>
        <h1>🎯 UniQuiz</h1>
        <div class="hero-sub">知識を試して、理解を深めよう</div>
        <div class="hero-deco">⚡ 💡 📖 💡 ⚡</div>
      </div>
      ${renderPendingBanner()}
      ${renderEndpointWarning()}
      ${listHtml}
      <div class="top-actions">
        ${adminActionsHtml}
      </div>
    </div>
  `;
}

function createQuizSet(){
  if(!requireTeacherAuth()) return;
  const name = prompt('クイズセットの名前を入力してください');
  if(!name) return;
  const newSet = { id: uid('set'), name: name, questions: [] };
  data.quizSets.push(newSet);
  saveData();
  goToAdminQuestions(newSet.id);
}

function renameQuizSet(id){
  const set = getSet(id);
  if(!set) return;
  const name = prompt('新しい名前を入力してください', set.name);
  if(!name) return;
  set.name = name;
  saveData();
  render();
}

function deleteQuizSet(id){
  if(!confirm('このクイズセットを削除しますか?問題も全て削除されます。')) return;
  data.quizSets = data.quizSets.filter(s=>s.id!==id);
  saveData();
  goHome();
}

function goToAdminQuestions(id){
  if(!requireTeacherAuth()) return;
  currentSetId = id;
  view = 'adminQuestions';
  render();
}

function goHome(){
  stopTimer();
  session = null;
  currentSetId = null;
  view = 'home';
  render();
}

/* ---------- EXPORT / IMPORT ---------- */
function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function buildExportPayload(setIds){
  const sets = setIds ? data.quizSets.filter(s=>setIds.includes(s.id)) : data.quizSets;
  return {
    type: 'quizAppExport',
    version: 1,
    exportId: uid('exp'),
    exportedAt: new Date().toISOString(),
    quizSets: sets.map(s=>({ id: s.id, name: s.name, questions: s.questions }))
  };
}

function safeFileName(name){
  return String(name||'quiz').replace(/[^a-zA-Z0-9一-龠ぁ-んァ-ンー]/g,'_').slice(0,40) || 'quiz';
}

function exportQuizSet(setId){
  if(!requireTeacherAuth()) return;
  const set = getSet(setId);
  if(!set) return;
  downloadJSON('quiz_' + safeFileName(set.name) + '.json', buildExportPayload([setId]));
}

function exportAllQuizSets(){
  if(!requireTeacherAuth()) return;
  if(data.quizSets.length===0){ alert('書き出すクイズセットがありません'); return; }
  downloadJSON('quiz_all_' + Date.now() + '.json', buildExportPayload());
}

function importQuizData(payload, opts){
  opts = opts || {};
  if(!payload || !Array.isArray(payload.quizSets)){
    if(!opts.silent) alert('クイズデータの形式が正しくありません');
    return false;
  }
  if(payload.exportId && opts.dedupe && data.importedExportIds.includes(payload.exportId)){
    return false;
  }
  const importedNames = [];
  payload.quizSets.forEach(s=>{
    const newSet = {
      id: uid('set'),
      name: s && s.name ? s.name : '読み込まれたクイズ',
      questions: (s && Array.isArray(s.questions) ? s.questions : []).map(q=>{
        if(q && q.type === 'text'){
          return {
            id: uid('q'),
            type: 'text',
            text: q.text ? q.text : '',
            correctAnswers: Array.isArray(q.correctAnswers) ? q.correctAnswers.filter(a=>a!=null && String(a).trim()!=='') : [],
            timeLimit: q.timeLimit ? q.timeLimit : DEFAULT_TIME_LIMIT
          };
        }
        const choices = (q && Array.isArray(q.choices) && q.choices.length>=2) ? q.choices : ['','','',''];
        const correctIndex = (q && typeof q.correctIndex==='number' && q.correctIndex>=0 && q.correctIndex<choices.length) ? q.correctIndex : 0;
        return {
          id: uid('q'),
          type: 'choice',
          text: (q && q.text) ? q.text : '',
          choices: choices,
          correctIndex: correctIndex,
          timeLimit: (q && q.timeLimit) ? q.timeLimit : DEFAULT_TIME_LIMIT
        };
      })
    };
    data.quizSets.push(newSet);
    importedNames.push(newSet.name);
  });
  if(payload.exportId && !data.importedExportIds.includes(payload.exportId)){
    data.importedExportIds.push(payload.exportId);
  }
  saveData();
  if(!opts.silent){
    alert('✨ ' + importedNames.length + '件のクイズを読み込みました: ' + importedNames.join('、'));
  }
  view = 'home';
  render();
  return true;
}

function triggerImportPicker(){
  if(!requireTeacherAuth()) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function(){
    const file = input.files && input.files[0];
    if(input.parentNode) document.body.removeChild(input);
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const json = JSON.parse(e.target.result);
        importQuizData(json, {});
      }catch(err){
        alert('JSONファイルの読み込みに失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

function tryAutoImportFromUrl(){
  try{
    const params = new URLSearchParams(window.location.search);
    const url = params.get('import');
    if(!url) return;
    fetch(url).then(function(r){ return r.json(); }).then(function(json){
      importQuizData(json, { silent:true, dedupe:true });
    }).catch(function(){ /* ignore network/parse errors for auto-import */ });
  }catch(e){}
}

/* ---------- ADMIN: QUESTION LIST ---------- */
function renderAdminQuestions(){
  const set = getSet(currentSetId);
  if(!set){ goHome(); return ''; }
  let listHtml = '';
  if(set.questions.length===0){
    listHtml = '<div class="empty">📭 問題がまだありません。「➕ 問題を追加」から作成しましょう。</div>';
  } else {
    listHtml = set.questions.map((q,idx)=>{
      const typeLabel = q.type==='text' ? '✍️ 記述式' : ((q.choices&&q.choices.length===2) ? '🔘 2択' : '🔘 4択');
      const answerLabel = q.type==='text'
        ? ((q.correctAnswers&&q.correctAnswers.length) ? escapeHtml(q.correctAnswers[0])+(q.correctAnswers.length>1?' 他':'') : '(未設定)')
        : escapeHtml(q.choices[q.correctIndex]);
      return `
      <div class="card">
        <div class="card-title">${idx+1}. ${escapeHtml(q.text)}</div>
        <div class="card-sub">${typeLabel} ／ ✅ 正解: ${answerLabel} ／ ⏱️ ${q.timeLimit}秒</div>
        <div class="card-actions">
          <button class="secondary" onclick="moveQuestionUp('${q.id}')" ${idx===0?'disabled':''}>⬆️ 上へ</button>
          <button class="secondary" onclick="moveQuestionDown('${q.id}')" ${idx===set.questions.length-1?'disabled':''}>⬇️ 下へ</button>
          <button class="secondary" onclick="editQuestion('${q.id}')">✏️ 編集</button>
          <button class="danger" onclick="deleteQuestion('${q.id}')">🗑️ 削除</button>
        </div>
      </div>
    `;
    }).join('');
  }
  return `
    <div class="container">

  saveData();
  render();

function onQuestionTypeChange(){
  const type = document.getElementById('qf-type').value;
  const choicesBlock = document.getElementById('qf-choices-block');
  const textBlock = document.getElementById('qf-text-block');
  if(type === 'text'){
    choicesBlock.style.display = 'none';
    textBlock.style.display = '';
    return;
  }
  choicesBlock.style.display = '';
  textBlock.style.display = 'none';
  const n = (type === 'choice2') ? 2 : 4;
  for(let i=0;i<4;i++){
    const row = document.getElementById('qf-choice-row-'+i);
    if(!row) continue;
    if(i < n){
      row.style.display = '';
    } else {
      row.style.display = 'none';
      const radio = row.querySelector('input[type=radio]');
      if(radio) radio.checked = false;
    }
  }
  const anyChecked = choicesBlock.querySelector('input[type=radio]:checked');
  if(!anyChecked){
    const firstRadio = choicesBlock.querySelector('input[type=radio]');
    if(firstRadio) firstRadio.checked = true;
  }
}

function saveQuestion(e){
  e.preventDefault();
  const type = document.getElementById('qf-type').value;
  const text = document.getElementById('qf-text').value.trim();
  const timeLimitRaw = parseInt(document.getElementById('qf-timelimit').value,10);
  const timeLimit = isNaN(timeLimitRaw) ? DEFAULT_TIME_LIMIT : Math.min(300, Math.max(5, timeLimitRaw));

  if(!text){ alert('問題文を入力してください'); return; }

  let questionData;
  if(type === 'text'){
    const answerRaw = document.getElementById('qf-answer').value;
    const correctAnswers = answerRaw.split('\n').map(s=>s.trim()).filter(Boolean);
    if(correctAnswers.length===0){ alert('正解を1つ以上入力してください'); return; }
    questionData = { type:'text', text:text, correctAnswers:correctAnswers, timeLimit:timeLimit };
  } else {
    const n = type === 'choice2' ? 2 : 4;
    const choices = [];
    for(let i=0;i<n;i++) choices.push(document.getElementById('qf-choice-'+i).value.trim());
    if(choices.some(c=>!c)){ alert('選択肢を全て入力してください'); return; }
    const correctRadio = document.querySelector('input[name="qf-correct"]:checked');
    if(!correctRadio || parseInt(correctRadio.value,10)>=n){ alert('正解を選択してください'); return; }
    questionData = { type:'choice', text:text, choices:choices, correctIndex:parseInt(correctRadio.value,10), timeLimit:timeLimit };
  }

  const set = getSet(currentSetId);
  if(editingQuestionId){
    const idx = set.questions.findIndex(q=>q.id===editingQuestionId);
    set.questions[idx] = Object.assign({ id: editingQuestionId }, questionData);
  } else {
    set.questions.push(Object.assign({ id: uid('q') }, questionData));
  }
  saveData();
  view = 'adminQuestions';
  render();
}

/* ---------- ① SHUFFLE (Fisher-Yates) ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 保存データ（choices:文字列配列 + correctIndex）はそのまま。
   受験時にだけ { text, isCorrect } 形式へ変換してシャッフルするので、
   既存のJSON・?import= のQRリンクはそのまま使えます。 */
function buildRuntimeQuestion(q){
  if(q.type === 'text'){
    return { id:q.id, type:'text', text:q.text, correctAnswers:(q.correctAnswers||[]).slice(), timeLimit:q.timeLimit||DEFAULT_TIME_LIMIT };
  }
  const base = Array.isArray(q.choices) ? q.choices : [];
  const choices = shuffleArray(base.map((t,i)=>({ text:String(t), isCorrect: i===q.correctIndex })));
  return { id:q.id, type:'choice', text:q.text, choices:choices, timeLimit:q.timeLimit||DEFAULT_TIME_LIMIT };
}

function beginQuiz(){

    setName: set.name,

    index: 0,
    answers: [],
    answered: false,
    selectedIndex: null,
    streak: 0,
    test: isTeacherAuthed(),      // 講師ログイン中の受験はテスト扱い（送信しない）
    payload: null
  };

function getCurrentQuestion(){
  if(!session) return null;
  return session.questions[session.index] || null;
}

function startTimer(){
  const q = getCurrentQuestion();
  if(!q) return;
  timeLeft = q.timeLimit || DEFAULT_TIME_LIMIT;
  stopTimer();
  render();
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      timeLeft = 0;
      stopTimer();
      handleTimeout();
    } else {
      updateTimerDisplay();   // 画面全体を描き直さない（記述式の入力中の文字・フォーカスを保つ）
    }
  }, 1000);
}

function updateTimerDisplay(){
  const q = getCurrentQuestion();
  if(!q) return;
  const limit = q.timeLimit || DEFAULT_TIME_LIMIT;
  const pct = Math.max(0, Math.min(100, (timeLeft/limit)*100));
  let color = 'var(--success)';
  if(pct < 25) color = 'var(--danger)';
  else if(pct < 55) color = 'var(--warning)';
  const f = document.getElementById('tm-fill');
  const t = document.getElementById('tm-text');
  if(f){ f.style.width = pct + '%'; f.style.background = color; }
  if(t) t.textContent = '⏱️ 残り ' + timeLeft + '秒';
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}

function normalizeAnswer(s){
  return String(s==null?'':s).replace(/[\s　]+/g,'').toLowerCase();
}
function isTextAnswerCorrect(q, answerText){
  const given = normalizeAnswer(answerText);
  if(!given) return false;
  return (q.correctAnswers||[]).some(a=>normalizeAnswer(a)===given);
}

function recordAnswer(response, timedOut){
  const q = getCurrentQuestion();
  if(!q) return;
  const isText = q.type === 'text';
  // ① 正誤は選択肢の isCorrect フラグで判定（シャッフルしてもズレない）
  const correct = !timedOut && (isText
    ? isTextAnswerCorrect(q, response)
    : !!(q.choices[response] && q.choices[response].isCorrect === true));
  session.answered = true;
  session.selectedIndex = isText ? null : response;
  session.answerText = isText ? (response||'') : null;
  session.streak = correct ? (session.streak||0) + 1 : 0;
  session.answers.push({
    questionId: q.id,
    text: q.text,
    type: isText ? 'text' : 'choice',
    choices: isText ? null : q.choices.map(c=>c.text),                    // 表示順（シャッフル後）
    correctIndex: isText ? null : q.choices.findIndex(c=>c.isCorrect),    // 表示順での正解位置
    correctAnswers: isText ? q.correctAnswers : null,
    selectedIndex: isText ? null : response,
    answerText: isText ? (response||'') : null,
    correct: correct,
    timedOut: !!timedOut
  });
}

function selectAnswer(i){
  if(!session || session.answered) return;
  stopTimer();
  recordAnswer(i, false);
  render();
  const last = session.answers[session.answers.length-1];
  if(last.correct){
    launchConfetti();
    if(session.streak >= 2) launchStreakPopup(session.streak);
  }
}

function submitTextAnswer(){
  if(!session || session.answered) return;

}

/* ---------- FUN: CONFETTI ---------- */
function launchConfetti(){
  const old = document.getElementById('confetti-canvas');
  if(old) old.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'confetti-canvas';
  document.body.appendChild(canvas);
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  const colors = ['#f43f5e','#fb923c','#facc15','#4ade80','#38bdf8','#a78bfa'];
  const particles = [];
  for(let i=0;i<90;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.4,
      w: 6+Math.random()*6,
      h: 4+Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: 3+Math.random()*4,
      vx: -2+Math.random()*4,
      rot: Math.random()*360,
      vrot: -12+Math.random()*24
    });
  }
  let frame = 0;
  const maxFrames = 110;
  function animate(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(frame<maxFrames && document.getElementById('confetti-canvas')){
      requestAnimationFrame(animate);
    } else if(canvas.parentNode){
      canvas.remove();
    }
  }
  animate();
}

    }).join('');

  }

  let feedbackHtml = '';
  if(session.answered){
    const lastAnswer = session.answers[session.answers.length-1];
    const correctAnswerLabel = q.type==='text' ? (q.correctAnswers||[]).join(' / ') : (q.choices.find(c=>c.isCorrect)||{text:''}).text;
    if(lastAnswer.correct){

      feedbackHtml = `<div class="feedback incorrect">⏰ 時間切れです。正解は「${escapeHtml(correctAnswerLabel)}」</div>`;
    } else {

    }
    feedbackHtml += `<div class="form-actions"><button onclick="nextQuestion()">${session.index+1>=total?'🎉 結果を見る':'次の問題へ →'}</button></div>`;
  }

  return `
    <div class="container quiz-container">
      <div class="card question-card">

        <div class="question-text">${escapeHtml(q.text)}</div>

          <div class="timer-text" id="tm-text">⏱️ 残り ${timeLeft}秒</div>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="tm-fill" style="width:${pct}%;background:${timerColor};"></div></div>
      </div>

  return {label:'チャレンジ中', emoji:'🔥', color:'#ef4444'};
}

  const rank = getRank(pct);
  const rowsHtml = session.answers.map((a,idx)=>{
    let selectedText, correctLabel;
    if(a.type === 'text'){
      selectedText = a.timedOut ? '(時間切れ・未回答)' : (a.answerText ? escapeHtml(a.answerText) : '(未回答)');
      correctLabel = escapeHtml((a.correctAnswers||[]).join(' / '));
    } else {
      selectedText = a.timedOut ? '(時間切れ・未回答)' : escapeHtml(a.choices[a.selectedIndex]);
      correctLabel = escapeHtml(a.choices[a.correctIndex]);
    }
    return `
      <div class="card result-row ${a.correct?'correct':'incorrect'}">
        <div>${idx+1}. ${escapeHtml(a.text)}</div>
        <div>${a.correct?'✅':'❌'} あなたの回答: ${selectedText}</div>
        <div>🎯 正解: ${correctLabel}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="container">
      <h1>🎊 結果発表</h1>
      <div class="rank-card">
        <div class="rank-emoji">${rank.emoji}</div>
        <div class="rank-label">${rank.label}</div>
        <div class="rank-sub">正解率 ${pct}%</div>
      </div>
      <div class="score">${correctCount} / ${total} 問正解</div>
      <div class="score-pct">正解率 ${pct}%</div>
      <div class="card-sub" style="margin:-14px 0 18px;">👤 ${escapeHtml(student.name)}（${escapeHtml(student.id)}）</div>
      <div class="top-actions">
        <button class="fun" onclick="downloadScoreImage()">📸 スコア画像を保存</button>
        <button class="secondary" onclick="downloadResultTableImage()">📋 結果一覧を画像で保存</button>
      </div>
      <div class="hint">画像が保存できないときは、共有メニューの「画像を保存」を選んでください。LINEなどのアプリ内ブラウザでは、Safari / Chromeで開き直すと保存できます。</div>
      ${rowsHtml}
      <div class="top-actions">
        <button onclick="goToComment()">✍️ 感想を書く</button>
      </div>
    </div>
  `;
}

/* ---------- 📱 受験用QRコード（講師用） ----------
   QRの中身: アプリURL/?import=クイズJSONのURL  （既存の ?import= 自動取り込みを利用） */
const QR_STORE_KEY = 'quizAppQrSettings_v1';
let qrSetId = null;
let qrLink = '';

function loadQrSettings(){
  try{ return JSON.parse(localStorage.getItem(QR_STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveQrSettings(st){
  try{ localStorage.setItem(QR_STORE_KEY, JSON.stringify(st)); }catch(e){}
}

/* GitHubの画面URL（blob / raw）が貼られても、取り込める raw.githubusercontent.com のURLに直す */
function toRawUrl(u){
  u = String(u||'').trim();
  let m = u.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^?#]+)/);
  if(m) return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3];
  m = u.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/raw\/(?:refs\/heads\/)?([^?#]+)/);
  if(m) return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3];
  return u;
}
function buildImportLink(appUrl, jsonUrl){
  const enc = encodeURIComponent(toRawUrl(jsonUrl)).replace(/%3A/gi, ':').replace(/%2F/gi, '/');  // : / はそのまま（QRを小さくする）
  return String(appUrl).replace(/[?#].*$/, '') + '?import=' + enc;
}
function makeQrSvg(text){
  const qr = qrcode(0, 'M');           // 型番は自動、誤り訂正レベルM
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), quiet = 4;
  let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d += 'M' + (c+quiet) + ',' + (r+quiet) + 'h1v1h-1z';
  const size = n + quiet*2;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" aria-label="受験用QRコード"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

function goToQr(setId){
  if(!requireTeacherAuth()) return;
  qrSetId = setId;
  view = 'qr';
  render();
  updateQr();
  window.scrollTo(0,0);
}
function renderQr(){
  const set = getSet(qrSetId);
  if(!set){ goHome(); return ''; }
  const st = loadQrSettings();
  const appUrl = st.appUrl || (location.origin + location.pathname);
  const jsonUrl = (st.jsonUrls || {})[qrSetId] || '';
  return `
    <div class="container">
      <button class="link" onclick="goToAdminQuestions('${set.id}')">← 問題管理へ戻る</button>
      <h1>📱 受験用QRコード</h1>
      <div class="card-sub" style="margin:-8px 0 16px;">📚 ${escapeHtml(set.name)}</div>
      ${renderEndpointWarning()}
      <div class="hint">① 「📤 このクイズを書き出す」で作ったJSONをGitHubにアップロード → ② そのファイルのURLを下に貼ってください（GitHubの画面に表示されているURLでも、Rawボタンのものでも大丈夫です）。ファイル名を英数字にすると、QRが小さくなって読み取りやすくなります。</div>
      <form onsubmit="return false;">
        <label>📄 クイズJSONのURL
          <input type="text" id="qr-json" value="${escapeHtml(jsonUrl)}" placeholder="https://github.com/…/quiz_xxx.json" oninput="updateQr()" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <label>🌐 アプリのURL
          <input type="text" id="qr-app" value="${escapeHtml(appUrl)}" oninput="updateQr()" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
      </form>
      <div id="qr-out"></div>
    </div>
  `;
}
function updateQr(){
  const out = document.getElementById('qr-out');
  if(!out) return;
  const jsonIn = document.getElementById('qr-json').value.trim();
  const appUrl = document.getElementById('qr-app').value.trim();
  const st = loadQrSettings();
  st.appUrl = appUrl;
  st.jsonUrls = st.jsonUrls || {};
  st.jsonUrls[qrSetId] = jsonIn;
  saveQrSettings(st);
  qrLink = '';
  if(!jsonIn){ out.innerHTML = '<div class="empty">クイズJSONのURLを入力すると、QRコードが表示されます</div>'; return; }
  if(!/^https:\/\//.test(toRawUrl(jsonIn)) || !/^https:\/\//.test(appUrl)){
    out.innerHTML = '<div class="banner">URLは https:// から始まる形で入力してください。</div>';
    return;
  }
  const link = buildImportLink(appUrl, jsonIn);
  let svg;
  try{ svg = makeQrSvg(link); }
  catch(e){ out.innerHTML = '<div class="banner">URLが長すぎてQRコードにできません。ファイル名を短い英数字にしてください。</div>'; return; }
  qrLink = link;
  out.innerHTML = `
    <div class="qr-box">${svg}</div>
    <div class="card-actions" style="justify-content:center;">
      <button onclick="showQrFullscreen()">🖥️ 大きく表示</button>
      <button class="secondary" onclick="checkQrJson()">✅ JSONを確認</button>
      <button class="secondary" onclick="copyQrLink()">📋 URLをコピー</button>
    </div>
    <div id="qr-msg" class="hint" role="status" style="text-align:center;margin-top:10px;"></div>
    <div class="hint" style="word-break:break-all;">${escapeHtml(link)}</div>
  `;
}
function showQrFullscreen(){
  if(!qrLink) return;
  closeQrFullscreen();
  const ov = document.createElement('div');
  ov.id = 'qr-overlay';
  ov.className = 'qr-overlay';
  ov.onclick = closeQrFullscreen;
  ov.innerHTML = makeQrSvg(qrLink) + '<div class="qr-close">タップで閉じる</div>';
  document.body.appendChild(ov);
}
function closeQrFullscreen(){
  const ov = document.getElementById('qr-overlay');
  if(ov) ov.remove();
}
function setQrMsg(t){ const m = document.getElementById('qr-msg'); if(m) m.textContent = t; }

/* 投影する前に、JSONが本当に取り込める状態か確認する */
async function checkQrJson(){
  const set = getSet(qrSetId);
  const raw = toRawUrl(document.getElementById('qr-json').value);
  setQrMsg('確認中…');
  try{
    const res = await fetch(raw, { cache:'no-store' });
    if(!res.ok) throw new Error('取得できませんでした（' + res.status + '）。URLと、GitHubへのアップロードを確認してください');
    const json = await res.json();
    if(!json || !Array.isArray(json.quizSets)) throw new Error('クイズデータの形式ではありません');
    const names = json.quizSets.map(s=>s && s.name).filter(Boolean);
    const n = json.quizSets.reduce((a,s)=>a + ((s && s.questions) ? s.questions.length : 0), 0);
    let msg = '✅ 読み込めました：' + names.join('、') + '（全' + n + '問）';
    if(set && names.length && !names.includes(set.name)) msg += '\n⚠️ 「' + set.name + '」とセット名が違います。別のファイルの可能性があります。';
    setQrMsg(msg);
    const m = document.getElementById('qr-msg'); if(m) m.style.whiteSpace = 'pre-wrap';
  }catch(err){
    let t = err.message;
    if(err instanceof TypeError) t = '通信に失敗しました。URLが正しいか、ネットワークを確認してください';
    else if(err.name === 'SyntaxError') t = 'JSONとして読み取れません。別のファイル（HTMLなど）を指している可能性があります';
    setQrMsg('⚠️ ' + t);
  }
}
async function copyQrLink(){
  if(!qrLink) return;
  try{
    await navigator.clipboard.writeText(qrLink);
    setQrMsg('📋 コピーしました');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = qrLink; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); setQrMsg('📋 コピーしました'); }catch(e2){ setQrMsg('コピーできませんでした。下のURLを長押ししてコピーしてください'); }
    document.body.removeChild(ta);
  }
}

/* ---------- ④ GOOGLE SHEETS ---------- */
function endpointReady(){ return /^https:\/\/script\.google\.com\/.+\/exec$/.test(SHEETS_ENDPOINT); }   // ウェブアプリのURL（末尾 /exec）
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function newSubmissionId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); }

/* 送信するのは氏名・学籍番号・セット名・点数・感想のみ（各問の回答内容は送りません） */
function buildPayload(){
  const correct = session.answers.filter(a=>a.correct).length;
  const total = session.questions.length;
  return {
    submissionId: newSubmissionId(),      // 再送時の二重登録防止用（GAS側で判定）
    name: student.name,
    studentId: student.id,
    quizSetName: session.setName,
    correct: correct,
    total: total,
    rate: total>0 ? Math.round(correct/total*1000)/10 : 0,
    comment: ''
  };
}

async function gasPost(body){
  if(!endpointReady()) throw Object.assign(new Error('送信先URL（SHEETS_ENDPOINT）が設定されていません。講師に連絡してください。'), {});
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, 15000);
  const retryable = function(msg){ return Object.assign(new Error(msg), { retryable:true }); };
  try{
    // text/plain にすることで CORS プリフライトを避ける（GAS の定番手法）
    const res = await fetch(SHEETS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    if(!res.ok) throw retryable('サーバーエラー（' + res.status + '）');
    const json = await res.json();
    if(!json.ok) throw Object.assign(new Error(json.error || '保存に失敗しました。'), { retryable: !!json.retryable });
    return json;
  }catch(err){
    if(err.name === 'AbortError') throw retryable('通信がタイムアウトしました。電波の良い場所でもう一度お試しください。');
    if(err instanceof TypeError) throw retryable('通信に失敗しました。ネットワーク接続を確認してもう一度お試しください。');
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

/* 授業終了時にアクセスが集中しても取りこぼさないよう、一時的な失敗は自動で数回やり直す
   （再送しても submissionId により二重登録されません） */
async function postToSheets(payload){
  const waits = [0, 2000, 5000];
  let last;
  for(const w of waits){
    if(w) await sleep(w + Math.random()*1500);
    try{ await gasPost(payload); return; }
    catch(err){ last = err; if(!err.retryable) break; }
  }
  throw last;
}

async function submitComment(ev){
  ev.preventDefault();
  if(sending || !session) return;
  const text = commentText.trim();
  if(COMMENT_REQUIRED && !text){ sendError = '感想を入力してください'; render(); return; }
  if(session.test){ view = 'done'; render(); window.scrollTo(0,0); return; }
  if(!session.payload) session.payload = buildPayload();
  session.payload.comment = text;
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify(Object.assign({ savedAt: Date.now() }, session.payload))); }catch(e){}
  sending = true; sendError = ''; render();
  try{
    await postToSheets(session.payload);
    try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
    sending = false;
    view = 'done';
    render();
    window.scrollTo(0,0);
  }catch(err){
    sending = false;
    sendError = err.message;
    render();
  }
}

/* 送信に失敗した回答は端末に残し、ホーム画面から再送できる */
/* 講師ログイン中だけ表示：SHEETS_ENDPOINT が未設定だと、学生が送信してもスプレッドシートに記録されない */
function renderEndpointWarning(){
  if(!isTeacherAuthed() || endpointReady()) return '';
  return '<div class="banner" role="alert">⚠️ 送信先URL（<b>SHEETS_ENDPOINT</b>）が未設定です。このままだと、学生が「送信する」を押しても記録されません。index.html の先頭付近で、Google Apps ScriptのウェブアプリURL（末尾が /exec）を設定してください。</div>';
}
function getPending(){
  try{ const raw = localStorage.getItem(PENDING_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function renderPendingBanner(){
  const p = getPending();
  if(!p) return '';
  return `
    <div class="banner" role="status">
      📨 未送信の回答があります（${escapeHtml(p.quizSetName)}）
      ${pendingError ? `<span class="err">${escapeHtml(pendingError)}</span>` : ''}
      <div class="card-actions">
        <button onclick="retryPending()" ${sending?'disabled':''}>${sending?'送信中…':'今すぐ送信'}</button>
        <button class="secondary" onclick="dropPending()">破棄する</button>
      </div>
    </div>`;
}
async function retryPending(){
  const p = getPending();
  if(!p || sending) return;
  sending = true; pendingError = ''; render();
  try{
    await postToSheets(p);
    try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
  }catch(err){
    pendingError = err.message;
  }
  sending = false;
  render();
}
function dropPending(){
  if(!confirm('未送信の回答を破棄します。よろしいですか?')) return;
  try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
  pendingError = '';
  render();
}

/* ---------- FUN: IMAGE DOWNLOADS ---------- */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  const chars = String(text==null?'':text).split('');
  const lines = [];
  let current = '';
  for(const ch of chars){
    const test = current + ch;
    if(current && ctx.measureText(test).width > maxWidth){
      lines.push(current);
      current = ch;
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  return lines.length ? lines : [''];
}

function triggerDownload(canvas, filename){
  canvas.toBlob(async function(blob){
    if(!blob) return;
    // スマホ：共有シートを開く（iOS/Androidとも「画像を保存」を選べる）。PC：通常のダウンロード
    if(window.matchMedia && window.matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.share){
      try{
        const file = new File([blob], filename, { type:'image/png' });
        if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
      }catch(err){
        if(err && err.name === 'AbortError') return;   // ユーザーが共有をキャンセル
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  });
}

function fitFont(ctx, text, weight, size, maxW){
  let s = size;
  ctx.font = weight + ' ' + s + 'px sans-serif';
  while(ctx.measureText(text).width > maxW && s > 16){ s -= 2; ctx.font = weight + ' ' + s + 'px sans-serif'; }
}

function downloadScoreImage(){
  if(!session) return;
  const setName = session.setName || 'クイズ';
  const correctCount = session.answers.filter(a=>a.correct).length;
  const total = session.answers.length;
  const pct = total>0 ? Math.round((correctCount/total)*100) : 0;
  const rank = getRank(pct);

  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  if(!ctx){ alert('お使いのブラウザでは画像生成に対応していません'); return; }

  const grad = ctx.createLinearGradient(0,0,800,1000);
  grad.addColorStop(0,'#667eea');
  grad.addColorStop(1,'#f093fb');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,800,1000);

  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(80,80,90,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(740,920,120,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(720,60,50,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  roundRect(ctx,60,150,680,780,28);   // 氏名・学籍番号の分だけ縦に拡張
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9ca3af';
  ctx.font = '24px sans-serif';
  ctx.fillText('QUIZ RESULT', 400, 215);

  ctx.fillStyle = '#1f2937';
  ctx.font = 'bold 34px sans-serif';
  wrapText(ctx, setName, 560).slice(0,2).forEach((line,i)=>{
    ctx.fillText(line, 400, 270 + i*42);
  });

  ctx.font = '100px sans-serif';
  ctx.fillText(rank.emoji, 400, 440);

  ctx.font = 'bold 46px sans-serif';
  ctx.fillStyle = rank.color;
  ctx.fillText(rank.label, 400, 510);

  ctx.font = 'bold 120px sans-serif';
  ctx.fillStyle = '#1f2937';
  ctx.fillText(correctCount + ' / ' + total, 400, 660);

  ctx.font = '30px sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText('正解率 ' + pct + '%', 400, 710);

  // ⑤ 氏名・学籍番号
  ctx.fillStyle = '#e5e7eb';
  ctx.fillRect(120, 740, 560, 2);
  ctx.fillStyle = '#1f2937';
  fitFont(ctx, student.name, 'bold', 38, 560);
  ctx.fillText(student.name, 400, 792);
  ctx.fillStyle = '#6b7280';
  fitFont(ctx, '学籍番号　' + student.id, 'normal', 28, 560);
  ctx.fillText('学籍番号　' + student.id, 400, 836);

  ctx.font = '20px sans-serif';
  ctx.fillStyle = '#9ca3af';
  const dateStr = new Date().toLocaleDateString('ja-JP');
  ctx.fillText(dateStr + '  ｜  クイズアプリ', 400, 892);

  triggerDownload(canvas, 'quiz_score_' + safeFileName(student.id) + '_' + Date.now() + '.png');
}

function downloadResultTableImage(){
  if(!session) return;
  const set = getSet(session.setId);
  const setName = set ? set.name : 'クイズ';
  const correctCount = session.answers.filter(a=>a.correct).length;
  const total = session.answers.length;

  const rowsData = session.answers.map((a,idx)=>({
    no: String(idx+1),
    question: a.text,
    yourAnswer: a.timedOut ? '(時間切れ)' : (a.type==='text' ? (a.answerText||'(未回答)') : a.choices[a.selectedIndex]),
    correctAnswer: a.type==='text' ? (a.correctAnswers||[]).join(' / ') : a.choices[a.correctIndex],
    result: a.correct ? '○ 正解' : '× 不正解'
  }));

  const colWidths = { no:50, question:340, yourAnswer:170, correctAnswer:170, result:120 };
  const padding = 12;
  const fontSize = 16;
  const lineHeight = 22;
  const headerHeight = 46;
  const titleHeight = 76;

  const tmpCanvas = document.createElement('canvas');
  const tctx = tmpCanvas.getContext('2d');
  if(!tctx){ alert('お使いのブラウザでは画像生成に対応していません'); return; }
  tctx.font = fontSize + 'px sans-serif';

  const rowLayouts = rowsData.map(r=>{
    const qLines = wrapText(tctx, r.question, colWidths.question - padding*2);
    const yLines = wrapText(tctx, r.yourAnswer, colWidths.yourAnswer - padding*2);
    const cLines = wrapText(tctx, r.correctAnswer, colWidths.correctAnswer - padding*2);
    const maxLines = Math.max(qLines.length, yLines.length, cLines.length, 1);
    return { height: Math.max(50, maxLines*lineHeight + padding*2), qLines, yLines, cLines };
  });

  const totalWidth = colWidths.no + colWidths.question + colWidths.yourAnswer + colWidths.correctAnswer + colWidths.result + padding*2;
  const totalHeight = titleHeight + headerHeight + rowLayouts.reduce((s,r)=>s+r.height,0) + 24;

  const canvas = document.createElement('canvas');
  canvas.width = totalWidth;
  canvas.height = totalHeight;
  const ctx = canvas.getContext('2d');
  if(!ctx){ alert('お使いのブラウザでは画像生成に対応していません'); return; }

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#1f2937';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(setName + ' - 結果一覧', padding, 36);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText('正解 ' + correctCount + ' / ' + total, padding, 62);

  let y = titleHeight;
  const headers = [
    { text:'No', w:colWidths.no },
    { text:'問題', w:colWidths.question },
    { text:'あなたの回答', w:colWidths.yourAnswer },
    { text:'正解', w:colWidths.correctAnswer },
    { text:'結果', w:colWidths.result }
  ];
  ctx.fillStyle = '#f3f4f6';
  ctx.fillRect(padding, y, totalWidth - padding*2, headerHeight);
  ctx.fillStyle = '#1f2937';
  ctx.font = 'bold ' + fontSize + 'px sans-serif';
  let x = padding;
  headers.forEach(h=>{
    ctx.fillText(h.text, x + padding, y + headerHeight/2 + 6);
    x += h.w;
  });
  y += headerHeight;

  rowsData.forEach((r,idx)=>{
    const rl = rowLayouts[idx];
    ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f9fafb';
    ctx.fillRect(padding, y, totalWidth - padding*2, rl.height);
    ctx.fillStyle = r.result.indexOf('○') === 0 ? '#16a34a' : '#dc2626';
    ctx.fillRect(padding, y, 4, rl.height);

    ctx.font = fontSize + 'px sans-serif';
    ctx.fillStyle = '#1f2937';
    x = padding;
    ctx.fillText(r.no, x + padding, y + rl.height/2 + 6);
    x += colWidths.no;
    rl.qLines.forEach((line,li)=>{
      ctx.fillText(line, x + padding, y + padding + lineHeight*(li+0.7));
    });
    x += colWidths.question;
    rl.yLines.forEach((line,li)=>{
      ctx.fillText(line, x + padding, y + padding + lineHeight*(li+0.7));
    });
    x += colWidths.yourAnswer;
    rl.cLines.forEach((line,li)=>{
      ctx.fillText(line, x + padding, y + padding + lineHeight*(li+0.7));
    });
    x += colWidths.correctAnswer;
    ctx.font = 'bold ' + fontSize + 'px sans-serif';
    ctx.fillStyle = r.result.indexOf('○') === 0 ? '#16a34a' : '#dc2626';
    ctx.fillText(r.result, x + padding, y + rl.height/2 + 6);

    y += rl.height;
  });

  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  let lineX = padding;
  [colWidths.no, colWidths.question, colWidths.yourAnswer, colWidths.correctAnswer].forEach(w=>{
    lineX += w;
    ctx.beginPath();
    ctx.moveTo(lineX, titleHeight);
    ctx.lineTo(lineX, canvas.height - 8);
    ctx.stroke();
  });

  triggerDownload(canvas, 'quiz_result_' + Date.now() + '.png');
}

render();
tryAutoImportFromUrl();
</script>
